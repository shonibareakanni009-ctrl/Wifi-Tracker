name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found. Creating basic structure note."
            mkdir -p app/build/outputs/apk/debug
            echo "Placeholder - run locally with Android Studio or add gradlew" > app/build/outputs/apk/debug/README.txt
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WifiTracker-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Build Release APK (unsigned)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace || true
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WifiTracker-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
