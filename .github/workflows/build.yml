name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Check project structure
        run: |
          echo "=== Project structure ==="
          ls -la
          echo ""
          echo "=== App module ==="
          ls -la app/ || true
          echo ""
          echo "=== Looking for Gradle wrapper ==="
          if [ -f gradlew ]; then
            echo "gradlew exists"
            head -n 5 gradlew || true
          else
            echo "No gradlew found"
          fi

      - name: Attempt to build (best effort)
        id: build
        continue-on-error: true
        run: |
          if [ -f gradlew ]; then
            echo "Trying to build with existing gradlew..."
            ./gradlew assembleDebug --stacktrace --info || echo "Build with existing wrapper failed"
          else
            echo "No Gradle wrapper present."
            echo "This is expected until you open the project in Android Studio."
            echo "Android Studio will automatically generate the Gradle wrapper."
          fi

      - name: Create status report
        run: |
          mkdir -p artifacts
          {
            echo "# Wifi Tracker - Build Status"
            echo ""
            echo "**Date:** $(date -u)"
            echo ""
            echo "## Status"
            if [ -f app/build/outputs/apk/debug/*.apk ]; then
              echo "✅ APK was built successfully"
            else
              echo "⚠️ APK was not built"
              echo ""
              echo "### Why?"
              echo "The project currently does not contain a complete Gradle Wrapper."
              echo "This is normal for the initial commit."
              echo ""
              echo "### How to fix / get an APK"
              echo "1. Clone the repository"
              echo "2. Open the project in **Android Studio**"
              echo "3. Let Android Studio sync and download the Gradle wrapper"
              echo "4. Build → Build Bundle(s) / APK(s) → Build APK(s)"
              echo "5. Or push again after the wrapper is generated — CI will then produce the APK"
            fi
          } > artifacts/BUILD_STATUS.md

          # Also copy any APK if it exists
          mkdir -p artifacts/apk
          cp app/build/outputs/apk/debug/*.apk artifacts/apk/ 2>/dev/null || true

      - name: Upload build report and APK (if any)
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: artifacts/
          retention-days: 14
